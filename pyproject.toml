[project]
name = "common-knowledge"
version = "0.1.0"
description = "Build tools for the Common Knowledge offline emergency USB drive"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "blake3==1.0.11",
    "beautifulsoup4==4.15.0",
    "geopandas==1.2.0",
    "gguf==0.19.0",
    "jinja2==3.1.6",
    "libzim==4.0.0",
    "markdown-it-py==4.2.0",
    "mdit-py-plugins==0.6.1",
    "openpyxl==3.1.5",
    "osmium==4.3.2",
    "pydantic==2.14.2",
    "pyproj==3.8.0",
    "pyyaml==6.0.3",
    "segno==1.6.6",
    "shapely==2.2.0",
    "weasyprint==70.0",
]

[project.scripts]
ck = "ck.cli:main"

[build-system]
requires = ["uv_build==0.9.24"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pypdf==6.21.4",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv.build-backend]
module-name = "ck"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
