name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make build-container
      - name: Check reviews and match the tag to configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker run --rm --network=none common-knowledge-build:dev ck validate --release
          docker run --rm --network=none --env RELEASE_TAG --entrypoint /workspace/.venv/bin/python common-knowledge-build:dev -c 'import os; from pathlib import Path; from ck.config import load_config; assert os.environ["RELEASE_TAG"] == "v" + load_config(Path.cwd()).build.version, "Tag and configured version differ"'
      - run: make check
      - name: Build every development image and attach corresponding GPL sources
        run: make release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          if-no-files-found: error
          compression-level: 0
          path: build/release/
  publish:
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: build/release
      - name: Check assets, upload into a draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build/release
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file ../../docs/release-notes.md
          gh release upload "$RELEASE_TAG" ./*
          gh release edit "$RELEASE_TAG" --draft=false
