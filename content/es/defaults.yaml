    "convener.rotation": {
      "source_sha256": "16f89e45cae6c8310da35d92d1f5449061f371838329edb811b99bc1082f3d21",
      "text": "Cada reunión termina eligiendo a quien dirigirá la siguiente. Nadie ocupa ese puesto dos días seguidos."
    },
    "convener.role_fallback": {
      "source_sha256": "2ed1500c96e758ed2058b34b7dee29b81cb8215f134ab508ed06f4b96cc964cd",
      "text": "Si nadie elige una función, la asume quien tenga una unidad de la variante con ese tema, hasta que otra persona más preparada se ofrezca."
    },
    "radio.privacy_code": {
      "source_sha256": "140bedbf9c3f6d56a9846d2ba7088798683f4da0c248231336e6a05679e4fdfe",
