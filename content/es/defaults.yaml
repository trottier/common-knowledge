      "source_sha256": "b6729f6f668a5137fbdcd49534d66c83dda0e57ffeb3bfabec382d3b9082feb1",
      "text": "La primera persona adulta que llegue al punto de encuentro al mediodía abre la reunión con el guion de una página."
